<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Заказы</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/components">Комплектующие</a>
            <a href="/orders">Заказы</a>
        </nav>
    </header>

    <main>
        <h2>Список заказов</h2>

        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Агент</th>
                    <th>Статус</th>
                    <th>Сумма</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Компьютер-Сервис</td>
                    <td><span class="status">Новый</span></td>
                    <td>75 000 ₽</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>ТехноМир</td>
                    <td><span class="status">Подтверждён</span></td>
                    <td>95 000 ₽</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>ПК Центр</td>
                    <td><span class="status">В производстве</span></td>
                    <td>82 000 ₽</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
