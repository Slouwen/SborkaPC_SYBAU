<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="m-0 font-sans bg-slate-100 text-slate-800">

    <header class="bg-slate-800 text-white px-[5%] py-6">
        <h1 class="text-2xl font-bold mb-4">Заказы</h1>
        <nav class="flex flex-wrap gap-6">
            <a href="/" class="text-white no-underline hover:text-blue-300 transition-colors">Главная</a>
            <a href="/components" class="text-white no-underline hover:text-blue-300 transition-colors">Комплектующие</a>
            <a href="/orders" class="text-white no-underline hover:text-blue-300 transition-colors">Заказы</a>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto px-6 my-9">
        <h2 class="text-2xl font-semibold mb-4">Список заказов</h2>

        <div class="overflow-x-auto">
            <table class="w-full mt-5 bg-white border-collapse rounded-xl overflow-hidden shadow-sm">
                <thead>
                    <tr class="bg-slate-200">
                        <th class="p-4 text-left font-semibold">№</th>
                        <th class="p-4 text-left font-semibold">Агент</th>
                        <th class="p-4 text-left font-semibold">Статус</th>
                        <th class="p-4 text-left font-semibold">Сумма</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-slate-200 hover:bg-slate-50">
                        <td class="p-4">1</td>
                        <td class="p-4">Компьютер-Сервис</td>
                        <td class="p-4"><span class="inline-block px-3 py-1 bg-blue-100 rounded-md text-blue-800 text-sm">Новый</span></td>
                        <td class="p-4">75 000 ₽</td>
                    </tr>
                    <tr class="border-b border-slate-200 hover:bg-slate-50">
                        <td class="p-4">2</td>
                        <td class="p-4">ТехноМир</td>
                        <td class="p-4"><span class="inline-block px-3 py-1 bg-blue-100 rounded-md text-blue-800 text-sm">Подтверждён</span></td>
                        <td class="p-4">95 000 ₽</td>
                    </tr>
                    <tr class="hover:bg-slate-50">
                        <td class="p-4">3</td>
                        <td class="p-4">ПК Центр</td>
                        <td class="p-4"><span class="inline-block px-3 py-1 bg-blue-100 rounded-md text-blue-800 text-sm">В производстве</span></td>
                        <td class="p-4">82 000 ₽</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
