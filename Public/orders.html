<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки — Сборка и реализация компьютеров</title>
    <meta name="description" content="Список заказов партнёров-агентов на сборку компьютеров.">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="m-0 font-sans bg-slate-100 text-slate-800 flex min-h-screen">

    <!-- ЛЕВЫЙ САЙДБАР -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex shrink-0">
        <div class="p-6 text-sm font-bold border-b border-slate-700 leading-tight">
            Сборка и реализация компьютеров
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm">
            <a href="/" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Главная</a>
            <a href="/dashboard" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Рабочий кабинет</a>
            <a href="/components" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Комплектующие</a>
            <a href="/orders" class="block px-4 py-2 bg-slate-800 rounded-lg text-blue-300 font-semibold">Заявки</a>
            <a href="/production" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Производство</a>
            <a href="/warehouse" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Склад</a>
            <a href="/agents" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Агенты</a>
            <a href="/analytics" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Аналитика</a>
        </nav>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="flex-1 flex flex-col min-w-0">
        <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
            <h1 class="text-xl font-semibold text-slate-800">Заявки</h1>
        </header>

        <div class="p-8 space-y-8 flex-1 bg-slate-100 overflow-y-auto">
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                <h2 class="text-lg font-semibold mb-4 text-slate-800">Список заказов</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-slate-200">
                                <th class="text-left py-3 px-4 text-sm font-semibold text-slate-600">№</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-slate-600">Агент</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-slate-600">Статус</th>
                                <th class="text-right py-3 px-4 text-sm font-semibold text-slate-600">Сумма</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b border-slate-100 hover:bg-slate-50">
                                <td class="py-4 px-4 text-sm font-semibold text-blue-600">1</td>
                                <td class="py-4 px-4 text-sm">Компьютер-Сервис</td>
                                <td class="py-4 px-4 text-sm">
                                    <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-md text-xs font-semibold">Новый</span>
                                </td>
                                <td class="py-4 px-4 text-sm text-right">75 000 ₽</td>
                            </tr>
                            <tr class="border-b border-slate-100 hover:bg-slate-50">
                                <td class="py-4 px-4 text-sm font-semibold text-blue-600">2</td>
                                <td class="py-4 px-4 text-sm">ТехноМир</td>
                                <td class="py-4 px-4 text-sm">
                                    <span class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-md text-xs font-semibold">Подтверждён</span>
                                </td>
                                <td class="py-4 px-4 text-sm text-right">95 000 ₽</td>
                            </tr>
                            <tr class="hover:bg-slate-50">
                                <td class="py-4 px-4 text-sm font-semibold text-blue-600">3</td>
                                <td class="py-4 px-4 text-sm">ПК Центр</td>
                                <td class="py-4 px-4 text-sm">
                                    <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-md text-xs font-semibold">В производстве</span>
                                </td>
                                <td class="py-4 px-4 text-sm text-right">82 000 ₽</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
