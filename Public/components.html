<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комплектующие — Сборка и реализация компьютеров</title>
    <meta name="description" content="Каталог комплектующих для сборки компьютеров.">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="m-0 font-sans bg-slate-100 text-slate-800 flex min-h-screen">

    <!-- ЛЕВЫЙ САЙДБАР -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex shrink-0">
        <div class="p-6 text-sm font-bold border-b border-slate-700 leading-tight">
            Сборка и реализация компьютеров
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm">
            <a href="/" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Главная</a>
            <a href="/dashboard" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Рабочий кабинет</a>
            <a href="/components" class="block px-4 py-2 bg-slate-800 rounded-lg text-blue-300 font-semibold">Комплектующие</a>
            <a href="/orders" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Заявки</a>
            <a href="/production" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Производство</a>
            <a href="/warehouse" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Склад</a>
            <a href="/agents" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Агенты</a>
            <a href="/analytics" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Аналитика</a>
        </nav>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="flex-1 flex flex-col min-w-0">
        <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
            <h1 class="text-xl font-semibold text-slate-800">Комплектующие</h1>
        </header>

        <div class="p-8 space-y-8 flex-1 bg-slate-100 overflow-y-auto">
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                <h2 class="text-lg font-semibold mb-4 text-slate-800">Список комплектующих</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-slate-200">
                                <th class="text-left py-3 px-4 text-sm font-semibold text-slate-600">Название</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-slate-600">Тип</th>
                                <th class="text-left py-3 px-4 text-sm font-semibold text-slate-600">Цена</th>
                                <th class="text-right py-3 px-4 text-sm font-semibold text-slate-600">Количество</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b border-slate-100 hover:bg-slate-50">
                                <td class="py-4 px-4 text-sm">Intel Core i5</td>
                                <td class="py-4 px-4 text-sm">Процессор</td>
                                <td class="py-4 px-4 text-sm">18 000 ₽</td>
                                <td class="py-4 px-4 text-sm text-right">20</td>
                            </tr>
                            <tr class="border-b border-slate-100 hover:bg-slate-50">
                                <td class="py-4 px-4 text-sm">RTX 4060</td>
                                <td class="py-4 px-4 text-sm">Видеокарта</td>
                                <td class="py-4 px-4 text-sm">35 000 ₽</td>
                                <td class="py-4 px-4 text-sm text-right">8</td>
                            </tr>
                            <tr class="hover:bg-slate-50">
                                <td class="py-4 px-4 text-sm">Kingston 16GB</td>
                                <td class="py-4 px-4 text-sm">Оперативная память</td>
                                <td class="py-4 px-4 text-sm">5 000 ₽</td>
                                <td class="py-4 px-4 text-sm text-right">25</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
