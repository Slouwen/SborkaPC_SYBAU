<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Вход — Сборка и реализация компьютеров</title><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"></head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-5">
<main class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8">
  <a href="/" class="text-sm text-blue-600">← На главную</a>
  <div class="mt-5 mb-7"><div class="text-3xl mb-3">🖥️</div><h1 class="text-2xl font-bold text-slate-900 dark:text-white">Сборка и реализация компьютеров</h1><p class="text-sm text-slate-500 mt-2">Войдите в рабочую систему или создайте аккаунт сотрудника.</p></div>
  <section id="login-panel"><h2 class="text-lg font-semibold mb-4">Вход в систему</h2><form id="login-form" class="space-y-4"><label class="block text-sm">Электронная почта<input id="login-email" type="email" required autocomplete="email" class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-3"></label><label class="block text-sm">Пароль<input id="login-password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-3"></label><button class="w-full rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3">Войти</button></form><p class="text-sm text-slate-500 mt-5">Нет аккаунта? <button id="show-register" class="text-blue-600 font-semibold">Зарегистрироваться</button></p></section>
  <section id="register-panel" class="hidden"><h2 class="text-lg font-semibold mb-4">Регистрация</h2><form id="register-form" class="space-y-4"><label class="block text-sm">ФИО<input id="register-name" type="text" required maxlength="120" autocomplete="name" class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-3"></label><label class="block text-sm">Электронная почта<input id="register-email" type="email" required autocomplete="email" class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-3"></label><label class="block text-sm">Пароль<input id="register-password" type="password" required minlength="8" autocomplete="new-password" class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 p-3"></label><p class="text-xs text-slate-500">После регистрации Supabase отправит письмо для подтверждения адреса.</p><button class="w-full rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3">Создать аккаунт</button></form><p class="text-sm text-slate-500 mt-5">Уже есть аккаунт? <button id="show-login" class="text-blue-600 font-semibold">Войти</button></p></section>
  <p id="auth-message" class="mt-4 text-sm" role="status" aria-live="polite"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script><script src="/js/auth.js"></script></body></html>
