<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий кабинет — Сборка и реализация компьютеров</title>
    <meta name="description" content="Дашборд рабочего кабинета: статистика заявок, производство и склад.">
    <script src="/theme.js"></script><link rel="stylesheet" href="/style.css">
</head>
<body class="m-0 font-sans bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex min-h-screen">

    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex shrink-0">
        <div class="p-6 text-sm font-bold border-b border-slate-700 leading-tight">
            Сборка и реализация компьютеров
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm">
            <a href="/" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Главная</a>
            <a href="/dashboard" class="block px-4 py-2 bg-slate-800 rounded-lg text-blue-300 font-semibold">Рабочий кабинет</a>
            <a href="/components" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Комплектующие</a>
            <a href="/orders" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Заявки</a>
            <a href="/production" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Производство</a>
            <a href="/warehouse" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Склад</a>
            <a href="/agents" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Агенты</a>
                    <a href="/profile" class="block px-4 py-2 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors">Личный профиль</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="bg-white dark:bg-slate-800 shadow-sm px-8 py-4 flex justify-between items-center">
            <h1 class="text-xl font-semibold text-slate-800 dark:text-slate-100">Рабочий кабинет</h1>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
                <div class="text-sm text-slate-500 dark:text-slate-400">И.А. Моторико</div>
            </div>
        </header>

        <div class="p-8 space-y-8 flex-1 bg-slate-100 dark:bg-slate-900 overflow-y-auto">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">Новые заявки</p>
                    <p id="stat-new-orders" class="text-3xl font-bold text-slate-800 dark:text-slate-100">12</p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">В производстве</p>
                    <p id="stat-production-orders" class="text-3xl font-bold text-slate-800 dark:text-slate-100">8</p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">Критические остатки</p>
                    <p id="stat-stock-critical" class="text-3xl font-bold text-red-600 dark:text-red-400">5</p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">Агенты</p>
                    <p id="stat-agents" class="text-3xl font-bold text-slate-800 dark:text-slate-100">24</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 p-6">
                    <h2 class="text-lg font-semibold mb-4 text-slate-800 dark:text-slate-100">Последние заявки</h2>
                    <div id="dashboard-orders" class="space-y-4"><p class="text-sm text-slate-500">Загрузка...</p></div>
                </div>

                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 p-6">
                    <h2 class="text-lg font-semibold mb-4 text-slate-800 dark:text-slate-100">Состояние склада</h2>
                    <div id="dashboard-warehouse" class="space-y-4"><p class="text-sm text-slate-500">Загрузка...</p></div>
                </div>
            </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/database.js"></script>
</body>
</html>
